# Configuration des sources du Bénin Open Data Hub.
# Modifie ce fichier pour ajouter des indicateurs ou des pays de comparaison :
# aucune autre modification de code n'est nécessaire.

worldbank:
  base_url: https://api.worldbank.org/v2
  # Pays de référence + pays de comparaison (codes ISO3)
  focus_country: BEN
  peer_countries: [TGO, NGA, BFA, NER, CIV, SEN]
  start_year: 2000
  end_year: 2025
  # Indicateurs World Bank (WDI). theme sert au regroupement dans le dashboard.
  # higher_is_better sert au classement Bénin vs pairs (null = pas de classement).
  # section : « tableau de bord » (défaut) ou « investir » (onglet Investir au Bénin uniquement,
  # disponible aussi dans Comparer).
  indicators:
    - code: SP.POP.TOTL
      label: Population totale
      theme: Démographie
      unit: habitants
      higher_is_better: null
    - code: SP.URB.TOTL.IN.ZS
      label: Population urbaine
      theme: Démographie
      unit: "% de la population"
      higher_is_better: null
    - code: SP.DYN.LE00.IN
      label: Espérance de vie à la naissance
      theme: Santé
      unit: années
      higher_is_better: true
    - code: NY.GDP.MKTP.CD
      label: PIB
      theme: Économie
      unit: USD courants
      higher_is_better: true
    - code: NY.GDP.PCAP.CD
      label: PIB par habitant
      theme: Économie
      unit: USD courants
      higher_is_better: true
    - code: NY.GDP.MKTP.KD.ZG
      label: Croissance du PIB
      theme: Économie
      unit: "% annuel"
      higher_is_better: true
    - code: FP.CPI.TOTL.ZG
      label: Inflation (prix à la consommation)
      theme: Économie
      unit: "% annuel"
      higher_is_better: false
    - code: IT.NET.USER.ZS
      label: Utilisateurs d'Internet
      theme: Numérique
      unit: "% de la population"
      higher_is_better: true
    - code: IT.CEL.SETS.P2
      label: Abonnements mobiles
      theme: Numérique
      unit: pour 100 habitants
      higher_is_better: true
    - code: EG.ELC.ACCS.ZS
      label: Accès à l'électricité
      theme: Infrastructures
      unit: "% de la population"
      higher_is_better: true
    - code: SE.PRM.ENRR
      label: Taux brut de scolarisation primaire
      theme: Éducation
      unit: "% brut"
      higher_is_better: true
    - code: SL.UEM.TOTL.ZS
      label: Chômage (estimation OIT)
      theme: Emploi
      unit: "% de la population active"
      higher_is_better: false

    # --- Investir au Bénin : marché, stabilité, climat des affaires --------------
    # Écartés faute de données récentes pour la plupart des 7 pays (vérifié le 2026-10-14) :
    # dette publique (GC.DOD.TOTL.GD.ZS), recettes fiscales (GC.TAX.TOTL.GD.ZS),
    # taux d'intérêt débiteur (FR.INR.LEND).
    - code: SP.POP.1564.TO.ZS
      label: Population de 15 à 64 ans
      theme: Démographie
      unit: "% de la population"
      higher_is_better: null
      section: investir
    - code: SL.TLF.TOTL.IN
      label: Population active
      theme: Emploi
      unit: personnes
      higher_is_better: null
      section: investir
    - code: NY.GDP.PCAP.PP.CD
      label: PIB par habitant (PPA)
      theme: Économie
      unit: USD PPA courants
      higher_is_better: true
      section: investir
    - code: NV.AGR.TOTL.ZS
      label: Agriculture (valeur ajoutée)
      theme: Économie
      unit: "% du PIB"
      higher_is_better: null
      section: investir
    - code: NV.IND.TOTL.ZS
      label: Industrie (valeur ajoutée)
      theme: Économie
      unit: "% du PIB"
      higher_is_better: null
      section: investir
    - code: NV.SRV.TOTL.ZS
      label: Services (valeur ajoutée)
      theme: Économie
      unit: "% du PIB"
      higher_is_better: null
      section: investir
    - code: PA.NUS.FCRF
      label: Taux de change officiel
      theme: Économie
      unit: monnaie locale pour 1 USD
      higher_is_better: null
      section: investir
    - code: FS.AST.PRVT.GD.ZS
      label: Crédit au secteur privé
      theme: Finance et investissement
      unit: "% du PIB"
      higher_is_better: true
      section: investir
    - code: BX.KLT.DINV.WD.GD.ZS
      label: IDE, entrées nettes
      theme: Finance et investissement
      unit: "% du PIB"
      higher_is_better: true
      section: investir
    - code: BX.KLT.DINV.CD.WD
      label: IDE, montant
      theme: Finance et investissement
      unit: USD courants
      higher_is_better: true
      section: investir
    - code: NE.TRD.GNFS.ZS
      label: Ouverture commerciale
      theme: Finance et investissement
      unit: "% du PIB"
      higher_is_better: null
      section: investir

nada:
  # Catalogue de microdonnées de l'INStaD (plateforme NADA).
  # On ne collecte que les métadonnées du catalogue (enquêtes, années, producteurs).
  # Source optionnelle : si elle est indisponible, le reste du pipeline continue.
  site_root: https://nada.instad.bj
  page_size: 100

manual:
  # data.gouv.bj n'autorise pas l'accès automatisé (robots.txt) :
  # les fichiers sont téléchargés à la main puis déposés dans data/manual/.
  # Chaque fichier doit être déclaré ici pour être chargé.
  folder: data/manual
  datasets: []
  # Exemple :
  # - file: effectifs_ecoles_2024.csv
  #   table: datagouvbj_effectifs_ecoles
  #   source_url: https://data.gouv.bj/...
  #   producer: Ministère des Enseignements Maternel et Primaire
  #   downloaded_on: 2026-10-11

odfa:
  # Open Data for Africa — portail Bénin (plateforme Knoema, Banque africaine de développement).
  # Collecte via l'API uniquement (robots.txt interdit /api/1.0/sdmx, jamais utilisé).
  # `make run` rafraîchit le catalogue ; `make odfa` collecte les données (long, reprend où il s'est arrêté).
  host: benin.opendataforafrica.org
  pause_seconds: 2        # pause entre deux jeux de données
  max_datasets: null      # ex. 5 pour un premier essai
  include: []             # ids à collecter en priorité (vide = tous)
  exclude: []             # ids à ignorer (ex. jeux trop lourds)
  # Facultatif, pour relever les quotas d'appels : variables d'environnement
  # ODFA_APP_ID et ODFA_APP_SECRET (créées sur https://benin.opendataforafrica.org/user/apps).
