version: 2

sources:
  - name: raw
    description: Tables brutes chargées par `python -m ingestion.run` (toutes les colonnes en texte).
    tables:
      - name: wb_observations
        description: Observations World Bank (API v2), une ligne par indicateur × pays × année.
      - name: wb_indicator_catalog
        description: Métadonnées métier des indicateurs, issues de config/sources.yml.
      - name: wb_indicator_meta
        description: Nom, définition officielle (sourceNote) et organisme producteur de chaque indicateur (API /v2/fr/indicator).
      - name: nada_studies
        description: Catalogue des enquêtes de l'INStaD (plateforme NADA), métadonnées seulement.
      - name: manual_registry
        description: Registre des fichiers déposés à la main (data.gouv.bj, etc.) et de leur provenance.
      - name: odfa_datasets
        description: Catalogue du portail Open Data for Africa — Bénin (API Knoema /api/1.0/meta/dataset).
      - name: odfa_fetch_log
        description: Journal de collecte par jeu de données (statut, lignes, erreur), cumulé entre exécutions.
      - name: odfa_observations
        description: Valeurs collectées sur Open Data for Africa, une ligne par série × date.
      - name: source_health
        description: >
          Baromètre de l'accès aux données : un test HTTP par source et par exécution
          (code, temps de réponse, API officielle, licence, politique de collecte). Cumulé, jamais écrasé.
