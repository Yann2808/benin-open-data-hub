version: 2

models:
  - name: dim_country
    description: Pays présents dans les données, libellés FR, drapeau du pays focus.
    columns:
      - name: country_iso3
        data_tests: [unique, not_null]
      - name: is_focus
        data_tests: [not_null]

  - name: dim_indicator
    description: Indicateurs suivis, avec libellé FR, thème, unité et sens de lecture.
    columns:
      - name: indicator_code
        data_tests: [unique, not_null]
      - name: label_fr
        data_tests: [not_null]
      - name: theme
        data_tests: [not_null]
      - name: section
        description: Où l'indicateur s'affiche (tableau de bord général ou onglet Investir).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tableau de bord', 'investir']

  - name: fct_indicator_values
    description: Une ligne par indicateur × pays × année (valeurs renseignées uniquement).
    columns:
      - name: collection_status
        description: collectée (API de la source) ou démo (valeur synthétique de `make demo`).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [collectée, démo]
      - name: observation_id
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]
      - name: indicator_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_code
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3

  - name: mart_latest_values
    description: Dernière valeur par indicateur × pays et évolution sur `trend_years` ans.
    columns:
      - name: collection_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [collectée, démo]
      - name: latest_id
        data_tests: [unique, not_null]

  - name: mart_benin_scorecard
    description: >
      Bénin face à ses pairs : dernière valeur, évolution, médiane des pairs, rang.
      Une ligne par indicateur suivi, même si la donnée manque (position = « données insuffisantes »).
    columns:
      - name: indicator_code
        data_tests: [unique, not_null]
      - name: position_vs_peers
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - mieux que la médiane des pairs
                  - moins bien que la médiane des pairs
                  - au-dessus de la médiane
                  - en dessous de la médiane
                  - données insuffisantes

  - name: mart_data_catalog
    description: Catalogue unifié des données connues sur le Bénin (indicateurs, enquêtes INStaD, jeux ODFA et HDX, fichiers déposés, sources seulement référencées).
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [indicateur, enquête, fichier déposé, jeu de données, source référencée]
      - name: title
        data_tests: [not_null]

  - name: mart_odfa_datasets
    description: >
      Inventaire du portail Open Data for Africa — Bénin : source, licence, date de mise à jour,
      années couvertes et statut de collecte de chaque jeu de données.
    columns:
      - name: dataset_id
        data_tests: [unique, not_null]
      - name: fetch_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, échec, non collecté]

  - name: mart_source_availability
    description: >
      Baromètre de l'accès aux données : une ligne par source testée, avec le dernier statut,
      le taux de disponibilité sur tout l'historique et la date de la dernière réponse réussie.
      « En panne » = la source ne répond pas ; cela ne dit rien de l'existence de la donnée.
    columns:
      - name: source
        data_tests: [unique, not_null]
      - name: last_tested_at
        data_tests: [not_null]
      - name: badge
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [joignable, en panne, collecte interdite]
      - name: reachability
        data_tests:
          - accepted_values:
              arguments:
                values: [joignable, en panne]
      - name: collection_policy
        data_tests:
          - accepted_values:
              arguments:
                values: [autorisée, catalogue seulement, interdite]
      - name: n_tests
        data_tests: [not_null]

  - name: mart_odin_scores
    description: >
      Scores ODIN (Open Data Watch, CC BY 4.0) : ouverture et couverture des statistiques officielles,
      de 0 à 100, pour le Bénin et ses pays de comparaison, à chaque édition. Méthodologie revue entre
      éditions : les évolutions dans le temps sont indicatives.
    columns:
      - name: odin_id
        data_tests: [unique, not_null]
      - name: overall_score
        data_tests: [not_null]
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3
