name: benin_open_data_hub
version: "0.1.0"
config-version: 2
profile: benin_open_data_hub

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  focus_country: BEN
  # Fenêtre (en années) pour comparer le Bénin à ses pairs : on prend la
  # dernière valeur de chaque pays si elle date de moins de N ans.
  comparison_window_years: 5
  trend_years: 5

models:
  benin_open_data_hub:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  benin_open_data_hub:
    +schema: reference
    countries:
      +column_types:
        is_uemoa: boolean
